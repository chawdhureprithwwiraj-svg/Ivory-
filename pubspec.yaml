name: ivory
description: "Ivory - Every story leaves a mark. A premium storytelling platform."
publish_to: 'none'
version: 0.7.5+14

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.0
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  file_selector: ^1.1.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/logo/

# The launcher icon. Regenerated in CI by "dart run flutter_launcher_icons"
# right after "flutter create", because android/ is not in the repo.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/ivory_icon.png"
  adaptive_icon_background: "assets/icon/ivory_icon_bg.png"
  adaptive_icon_foreground: "assets/icon/ivory_icon_foreground.png"
  min_sdk_android: 21
  
