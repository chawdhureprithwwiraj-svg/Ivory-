name: Build Ivory APK

# Runs on every push to main, and can also be started manually
# from the GitHub mobile browser (Actions tab -> Run workflow).
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compile Ivory into a downloadable APK
    runs-on: ubuntu-latest

    steps:
      # 1. Pull your repository code onto the free cloud machine
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java 17 is required by the modern Android Gradle Plugin
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Install Flutter (stable channel) with build caching for speed
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Print Flutter version
        run: flutter --version

      # 4. KEY MOBILE TRICK:
      # You cannot run "flutter create" on an Android phone, so we let the
      # cloud machine generate the android/ native folder for us. It only
      # fills in files that are MISSING - your lib/ and pubspec.yaml are
      # never overwritten.
      - name: Generate missing Android platform files
        run: flutter create . --project-name ivory --org com.ivory --platforms android

      # 5. Download all packages listed in pubspec.yaml
      - name: Install dependencies
        run: flutter pub get

      # 6. Static analysis - warns you about bad code but never blocks the build
      - name: Analyze code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      # 7. Build the release APK (split per architecture = smaller downloads)
      - name: Build release APK
        run: flutter build apk --release --split-per-abi

      # 8. Also build one universal APK that installs on ANY Android phone.
      # Use this one if you are unsure which file to download.
      - name: Build universal APK
        run: flutter build apk --release

      # 9. Upload the APKs so you can download them from your phone browser
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ivory-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 90
          if-no-files-found: error
          
