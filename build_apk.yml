name: Build Ivory APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compile Ivory into a downloadable APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Show environment
        run: |
          flutter --version
          java -version
          echo "--- files in repo ---"
          ls -R . | head -50

      # Generates the native android/ folder in the cloud.
      # Only fills in MISSING files - your lib/ code is never overwritten.
      - name: Generate missing Android platform files
        run: flutter create . --project-name ivory --org com.ivory --platforms android

      # flutter create also drops in a default test/widget_test.dart that
      # references a class called MyApp, which does not exist in Ivory.
      # Remove it so it can never break the build.
      - name: Remove generated placeholder test
        run: rm -rf test

      - name: Install dependencies
        run: flutter pub get

      # One universal APK. Installs on every Android phone.
      - name: Build release APK
        run: flutter build apk --release

      # Only runs if the build above failed - prints the real reason.
      - name: Show failure details
        if: failure()
        run: |
          echo "=================== GRADLE DIAGNOSTICS ==================="
          cd android && ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tail -80 || true

      - name: List built files
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ivory-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90
          if-no-files-found: error
