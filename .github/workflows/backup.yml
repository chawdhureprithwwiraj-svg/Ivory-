name: Nightly Ivory backup

# WHY THIS EXISTS
# Every member, payment, wish, subscription and message in Ivory
# lives in one free-tier Supabase database. The free plan has no
# point-in-time recovery: if that project is deleted, suspended or
# corrupted, there is nothing to restore from.
#
# This takes a full SQL dump every night and keeps it as a GitHub
# artifact for 90 days. It costs nothing, needs no server, and the
# file it produces can rebuild the entire database from scratch.
#
# ONE SECRET TO ADD (you do this yourself, never share it):
#   Repo -> Settings -> Secrets and variables -> Actions -> New secret
#   Name:  SUPABASE_DB_URL
#   Value: Supabase dashboard -> Project Settings -> Database ->
#          Connection string -> URI (session mode, port 5432),
#          with [YOUR-PASSWORD] replaced by the real password.

on:
  schedule:
    # 03:30 UTC = 09:00 IST, after the night is over.
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    name: Dump the database
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Install a matching Postgres client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          pg_dump --version

      - name: Check the secret is present
        run: |
          if [ -z "${{ secrets.SUPABASE_DB_URL }}" ]; then
            echo "::error::SUPABASE_DB_URL is not set. Add it in Settings -> Secrets -> Actions."
            exit 1
          fi
          echo "Secret found."

      - name: Dump
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          REGION: ${{ secrets.SUPABASE_REGION }}
        run: |
          set -o pipefail

          # Supabase gives out two kinds of connection string. The
          # "Direct connection" one (db.<ref>.supabase.co) resolves
          # to IPv6 only, and GitHub runners have no IPv6 - that is
          # the "Network is unreachable" failure. The pooler is IPv4.
          #
          # Rather than make you copy the right one, this rewrites a
          # direct URL into the pooler form automatically.
          python3 - <<'PYEOF' > /tmp/url.txt
          import os, re
          from urllib.parse import urlparse, quote

          raw = os.environ['DB_URL'].strip()
          region = (os.environ.get('REGION') or 'ap-south-1').strip()
          p = urlparse(raw)
          host = p.hostname or ''
          m = re.match(r'^db\.([a-z0-9]+)\.supabase\.co$', host)
          if m:
              ref = m.group(1)
              pw = quote(p.password or '', safe='')
              raw = ('postgresql://postgres.' + ref + ':' + pw +
                     '@aws-0-' + region + '.pooler.supabase.com:5432/postgres')
              print('REWROTE', file=__import__('sys').stderr)
          print(raw)
          PYEOF

          URL=$(cat /tmp/url.txt)
          PW=$(python3 -c "import sys;from urllib.parse import urlparse;print(urlparse(sys.argv[1]).password or '')" "$URL")
          [ -n "$PW" ] && echo "::add-mask::$PW"
          HOST=$(python3 -c "import sys;from urllib.parse import urlparse;print(urlparse(sys.argv[1]).hostname or '')" "$URL")
          echo "Connecting to host: $HOST"

          STAMP=$(date -u +'%Y-%m-%d')

          dump_with () {
            pg_dump "$1" --schema=public --no-owner --no-acl \
              --format=plain | gzip -9 > "ivory-${STAMP}.sql.gz"
          }

          # aws-0 is the usual pooler prefix; a few projects sit on
          # aws-1. Try the second only if the first cannot be reached.
          if ! dump_with "$URL"; then
            ALT=$(echo "$URL" | sed 's/@aws-0-/@aws-1-/')
            if [ "$ALT" != "$URL" ]; then
              echo "First pooler host failed, trying aws-1..."
              dump_with "$ALT"
            else
              exit 1
            fi
          fi

          ls -lh ivory-*.sql.gz

      - name: Make sure it is not empty
        run: |
          SIZE=$(stat -c%s ivory-*.sql.gz)
          echo "Dump size: ${SIZE} bytes"
          if [ "$SIZE" -lt 10000 ]; then
            echo "::error::The dump is suspiciously small. Check the connection string."
            exit 1
          fi
          echo "--- first lines ---"
          zcat ivory-*.sql.gz | head -20

      - name: Keep it for 90 days
        uses: actions/upload-artifact@v4
        with:
          name: ivory-backup-${{ github.run_number }}
          path: ivory-*.sql.gz
          retention-days: 90
          if-no-files-found: error

      - name: Summary
        if: always()
        run: |
          {
            echo "## Ivory backup"
            echo ""
            echo "Taken: $(date -u +'%d %b %Y %H:%M UTC')"
            echo ""
            echo "Download it from the Artifacts section of this run."
            echo ""
            echo "NOTE: this is the database only. Files in Supabase"
            echo "Storage (uploaded images, audio, video) are NOT in"
            echo "this dump - keep your own copies of those."
          } >> $GITHUB_STEP_SUMMARY

# END OF FILE - .github/workflows/backup.yml
