name: Build Ivory APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compile Ivory into a downloadable APK
    runs-on: ubuntu-24.04

    # Required so the workflow can publish the APK as a GitHub Release.
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Guard: if your Dart files are missing, "flutter create" would silently
      # substitute Flutter's default counter-app template and the build would
      # fail on template code you never wrote. Fail loudly and early instead.
      - name: Verify Ivory source files are present
        run: |
          echo "--- repo root ---"
          ls -la
          echo "--- lib/ ---"
          ls -laR lib || echo "NO lib FOLDER AT ALL"
          missing=0
          for f in lib/main.dart lib/theme/ivory_theme.dart lib/core/supabase_config.dart lib/models/ivory_profile.dart lib/models/media_ref.dart lib/models/ivory_post.dart lib/models/wish.dart lib/models/ivory_notification.dart lib/services/auth_service.dart lib/services/content_service.dart lib/services/wish_service.dart lib/services/notification_service.dart lib/widgets/post_card.dart lib/widgets/post_actions.dart lib/widgets/ivory_logo.dart lib/models/payment.dart lib/services/payment_service.dart lib/screens/checkout_screen.dart lib/screens/login_screen.dart lib/screens/main_shell.dart lib/screens/home_screen.dart lib/screens/explore_screen.dart lib/screens/wish_screen.dart lib/screens/premium_screen.dart lib/screens/inbox_screen.dart lib/screens/profile_screen.dart lib/screens/admin_screen.dart pubspec.yaml; do
            if [ ! -f "$f" ]; then
              echo "::error::MISSING FILE: $f - create it on GitHub before building."
              missing=1
            else
              echo "found: $f"
            fi
          done
          if [ -f lib/screens/feed_screen.dart ] || [ -f lib/screens/home_screen.dart.old ]; then
            echo "::warning::lib/screens/feed_screen.dart is no longer used - delete it on GitHub."
          fi
          if [ "$missing" = "1" ]; then
            echo "Build stopped. Add the missing file(s) and re-run."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Show environment
        run: |
          flutter --version
          java -version

      - name: Generate missing Android platform files
        run: flutter create . --project-name ivory --org com.ivory --platforms android

      # CRITICAL: Flutter's template adds the INTERNET permission only to the
      # debug and profile manifests, never to the main one. Without this step
      # a RELEASE apk cannot reach the network at all and every request fails
      # with "Failed host lookup ... errno = 7".
      - name: Add Android permissions to the release manifest
        run: |
          python3 - <<'PYEOF'
          import sys

          path = 'android/app/src/main/AndroidManifest.xml'
          xml = open(path, encoding='utf-8').read()

          permissions = [
              'android.permission.INTERNET',
              'android.permission.ACCESS_NETWORK_STATE',
          ]

          missing = [p for p in permissions if p not in xml]
          if missing:
              block = ''.join(
                  '    <uses-permission android:name="%s"/>\n' % p for p in missing
              )
              if '<application' not in xml:
                  sys.exit('ERROR: no <application> tag found in the manifest')
              xml = xml.replace('<application', block + '\n    <application', 1)
              open(path, 'w', encoding='utf-8').write(xml)
              print('Added:', ', '.join(missing))
          else:
              print('All permissions already present.')

          # url_launcher on Android 11+ can only see apps that the
          # manifest declares in <queries>. Without this block every
          # "Open in Telegram" / "Play now" button silently fails.
          xml = open(path, encoding='utf-8').read()
          if '<queries>' not in xml:
              queries = (
                  '    <queries>\n'
                  '        <intent>\n'
                  '            <action android:name="android.intent.action.VIEW"/>\n'
                  '            <data android:scheme="https"/>\n'
                  '        </intent>\n'
                  '        <intent>\n'
                  '            <action android:name="android.intent.action.VIEW"/>\n'
                  '            <data android:scheme="http"/>\n'
                  '        </intent>\n'
                  '        <intent>\n'
                  '            <action android:name="android.intent.action.VIEW"/>\n'
                  '            <data android:scheme="tg"/>\n'
                  '        </intent>\n'
                  '        <intent>\n'
                  '            <action android:name="android.intent.action.VIEW"/>\n'
                  '            <data android:scheme="upi"/>\n'
                  '        </intent>\n'
                  '    </queries>\n'
              )
              xml = xml.replace('<application', queries + '\n    <application', 1)
              open(path, 'w', encoding='utf-8').write(xml)
              print('Added <queries> block for url_launcher.')
          else:
              print('<queries> block already present.')

          # Fail loudly if anything is still missing.
          check = open(path, encoding='utf-8').read()
          assert 'android.permission.INTERNET' in check, 'INTERNET permission missing!'
          assert '<queries>' in check, '<queries> block missing!'
          print('--- manifest head ---')
          print('\n'.join(check.splitlines()[:30]))
          PYEOF

      - name: Remove generated placeholder test
        run: rm -rf test

      - name: Install dependencies
        run: flutter pub get

      - name: Generate the launcher icon
        run: |
          # pubspec declares both asset folders, so they must exist even if an
          # upload has not happened yet - otherwise the build stops.
          mkdir -p assets/icon assets/logo
          if [ -z "$(ls -A assets/icon)" ]; then touch assets/icon/.gitkeep; fi
          if [ -z "$(ls -A assets/logo)" ]; then touch assets/logo/.gitkeep; fi
          ls -la assets/icon assets/logo
          if [ ! -f assets/icon/ivory_icon.png ]; then
            echo '::warning::assets/icon/ivory_icon.png missing - keeping the default Flutter icon.'
          else
            if [ ! -f assets/icon/ivory_icon_foreground.png ] || [ ! -f assets/icon/ivory_icon_bg.png ]; then
              echo '::warning::Adaptive icon parts missing - falling back to the plain icon.'
              python3 - <<'PYEOF'
          lines = open('pubspec.yaml', encoding='utf-8').read().splitlines(True)
          keep = [l for l in lines if 'adaptive_icon_' not in l]
          open('pubspec.yaml', 'w', encoding='utf-8').writelines(keep)
          print('Removed adaptive_icon_* from pubspec.yaml for this build.')
          PYEOF
            fi
            dart run flutter_launcher_icons
            echo 'Launcher icon generated.'
          fi

      - name: Set the app name shown under the icon
        run: |
          python3 - <<'PYEOF'
          path = 'android/app/src/main/AndroidManifest.xml'
          xml = open(path, encoding='utf-8').read()
          import re
          xml = re.sub(r'android:label="[^"]*"', 'android:label="Ivory"', xml, count=1)
          open(path, 'w', encoding='utf-8').write(xml)
          print('App label set to Ivory.')
          PYEOF


      # The build runs inside a wrapper that captures EVERYTHING to build.log,
      # so the real error can be shown on the run Summary page afterwards.
      - name: Build release APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log
          echo "exit_status=$?" >> $GITHUB_OUTPUT

      # Prints the last 120 lines of the build log straight onto the
      # run Summary page - no need to open or scroll any logs on mobile.
      - name: Publish error report to Summary
        if: always()
        run: |
          {
            echo "## Ivory build report"
            echo ""
            echo "Result of \`flutter build apk --release\`:"
            echo ""
            echo '```text'
            if [ -f build.log ]; then
              tail -120 build.log
            else
              echo "build.log was never created - the job failed before the build step."
            fi
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      # Always uploads the full log, even when the build fails, so you can
      # download and read it if the summary is not enough.
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 30
          if-no-files-found: warn

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ivory-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90
          if-no-files-found: warn

      # Publishes the APK as a GitHub Release - a direct, unzipped, one-tap
      # download link that works perfectly in a mobile browser.
      - name: Publish APK to Releases
        if: hashFiles('build/app/outputs/flutter-apk/app-release.apk') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Ivory build ${{ github.run_number }}
          body: |
            Automatic build of Ivory from commit ${{ github.sha }}.

            Tap **app-release.apk** below to install on your Android phone.
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false

      # Fails the job at the very end, AFTER the report has been published.
      - name: Fail if the APK was not produced
        if: always()
        run: |
          if [ ! -f build/app/outputs/flutter-apk/app-release.apk ]; then
            echo "No APK was produced. Read the error report on the Summary page."
            exit 1
          fi
          echo "APK built successfully."
          ls -lh build/app/outputs/flutter-apk/
          
