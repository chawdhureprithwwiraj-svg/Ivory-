name: Build Ivory APK

on:
  workflow_dispatch:
  push:
    branches: [main]

# The APK is published as a GitHub Release, which needs write access to
# the repository contents. Without this block the token is read-only and
# the publish step fails with HTTP 403.
permissions:
  contents: write

jobs:
  build:
    name: Compile Ivory into a downloadable APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # A long file pasted from a phone can be cut short without warning.
      # This file and tools/ci_android.py both end with an END OF FILE
      # line, so a truncated paste is caught in seconds.
      - name: Check the build files are complete
        run: |
          for f in .github/workflows/build_apk.yml tools/ci_android.py \
                   tools/ci_sign.py; do
            if [ ! -f "$f" ]; then
              echo "::error::MISSING FILE: $f"
              exit 1
            fi
            if ! tail -n 3 "$f" | grep -q "END OF FILE"; then
              echo "::error::TRUNCATED PASTE: $f is incomplete. Paste it again."
              exit 1
            fi
            echo "complete: $f"
          done

      - name: Verify Ivory source files are present
        run: python3 tools/ci_android.py verify

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Show environment
        run: |
          flutter --version
          java -version

      - name: Generate missing Android platform files
        run: flutter create . --project-name ivory --org com.ivory --platforms android

      # Permissions, the url_launcher <queries> block, the launcher label
      # and compileSdk 36 for every module.
      - name: Prepare the Android project
        run: python3 tools/ci_android.py prepare

      - name: Wire up Firebase push (optional)
        run: python3 tools/ci_android.py firebase

      # ---- THE REAL SIGNATURE -------------------------------
      # This MUST run after `flutter create`, which rewrites the
      # Gradle files from scratch on every build, and before
      # `flutter build apk`, which reads them.
      #
      # If the secrets are not set this step prints a notice and
      # the build carries on debug-signed, exactly as before. So
      # this file is safe to merge before the keystore exists.
      - name: Sign with the Ivory release key (if the key is set)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: python3 tools/ci_sign.py sign

      - name: Remove generated placeholder test
        run: rm -f test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Generate the launcher icon
        run: |
          python3 tools/ci_android.py icons | tee icons.log
          if grep -q ICON_READY icons.log; then
            dart run flutter_launcher_icons
            ls -l android/app/src/main/res/mipmap-xxxhdpi/ || true
            if [ ! -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png ]; then
              echo "::error::flutter_launcher_icons produced no ic_launcher.png"
              exit 1
            fi
            echo "Launcher icon generated."
          else
            echo "::warning::Building with the default Flutter icon."
          fi

      - name: Build release APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log

      # Report the size of the one universal APK without changing the
      # established packaging command or producing ABI-split files.
      - name: Report single APK size
        if: always()
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "APK size unavailable because the build did not produce the file." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 - "$APK" <<'PY'
          import os
          import sys
          path = sys.argv[1]
          size = os.path.getsize(path)
          mib = size / (1024 * 1024)
          print(f"Single universal APK: {size:,} bytes ({mib:.2f} MiB)")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Single APK size\n\n")
              summary.write(f"`{size:,}` bytes ({mib:.2f} MiB)\n\n")
              summary.write("Built with the existing `flutter build apk --release` command; no ABI-split APKs were requested.\n")
          PY

      # Prints the tail of the build log straight onto the run Summary
      # page - no need to open or scroll any logs on a phone.
      - name: Publish error report to Summary
        if: always()
        run: |
          {
            echo "## Ivory build report"
            echo ""
            echo '```text'
            if [ -f build.log ]; then
              tail -120 build.log
            else
              echo "build.log was never created - the job failed earlier."
            fi
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 30
          if-no-files-found: warn

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ivory-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90
          if-no-files-found: warn

      # A GitHub Release is a direct, unzipped, one-tap download link that
      # works perfectly in a mobile browser.
      - name: Publish APK to Releases
        if: hashFiles('build/app/outputs/flutter-apk/app-release.apk') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Ivory build ${{ github.run_number }}
          body: |
            Automatic build of Ivory from commit ${{ github.sha }}.

            Tap **app-release.apk** below to install on your Android phone.
          files: build/app/outputs/flutter-apk/app-release.apk

      # Says in plain words WHICH key signed the APK, straight on
      # the Summary page. "Android Debug" means the secrets did not
      # take effect; her own name means they did.
      - name: Report which key signed the APK
        if: always()
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          [ -f "$APK" ] || exit 0
          SIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null \
                   | sort | tail -1)
          {
            echo "## Which key signed this build"
            echo ""
            echo '```text'
            if [ -n "$SIGNER" ]; then
              "$SIGNER" verify --print-certs "$APK" 2>&1 \
                | grep -i -E "Signer #1 certificate (DN|SHA-256)" || true
              if "$SIGNER" verify --print-certs "$APK" 2>&1 \
                   | grep -qi "CN=Android Debug"; then
                echo ""
                echo "THROWAWAY DEBUG KEY - not acceptable to Google Play."
              else
                echo ""
                echo "SIGNED WITH THE IVORY RELEASE KEY."
              fi
            else
              echo "apksigner not found; could not check."
            fi
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: Fail if the APK was not produced
        if: always()
        run: |
          if [ ! -f build/app/outputs/flutter-apk/app-release.apk ]; then
            echo "No APK was produced. Read the report on the Summary page."
            exit 1
          fi
          echo "APK built successfully."
          ls -lh build/app/outputs/flutter-apk/

# END OF FILE - .github/workflows/build_apk.yml
